<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#020617">
<title>Guía Rápida de Curas · Enfermería</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-2: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --green: #22c55e;
    --green-bg: rgba(34, 197, 94, 0.16);
    --amber: #f59e0b;
    --amber-bg: rgba(245, 158, 11, 0.16);
    --red: #ef4444;
    --red-bg: rgba(239, 68, 68, 0.18);
    --border: #334155;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 120px;
  }
  header {
    background: #020617;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .title-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  h1 {
    font-size: 1.05rem;
    margin: 0;
    color: #fff;
  }
  .badge {
    background: var(--accent);
    color: #020617;
    font-weight: 800;
    font-size: 0.72rem;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .sub {
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 3px;
  }
  nav {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
    padding: 10px 12px;
    background: #0b1220;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 58px;
    z-index: 19;
  }
  .tab-btn {
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 6px;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
  }
  .tab-btn.active {
    background: var(--accent);
    color: #020617;
    border-color: var(--accent);
  }
  main { padding: 12px; max-width: 680px; margin: 0 auto; }
  .section { display: none; }
  .section.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .card h2 {
    margin: 0 0 8px;
    font-size: 0.96rem;
    color: var(--accent);
  }
  .search-box {
    width: 100%;
    background: #0f172a;
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.88rem;
    margin-bottom: 8px;
  }
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .chip {
    background: var(--card-2);
    color: #e2e8f0;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 0.76rem;
    font-weight: 700;
    cursor: pointer;
  }
  .chip.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--accent);
    color: #fff;
  }
  .item-card {
    background: #162033;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .item-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .item-title {
    font-size: 0.92rem;
    font-weight: 800;
    color: #fff;
  }
  .item-cat {
    font-size: 0.7rem;
    font-weight: 700;
    background: #0f172a;
    color: var(--accent);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .coloquial {
    font-size: 0.8rem;
    color: #fde68a;
    margin-top: 4px;
  }
  .detail-list {
    margin: 8px 0 0;
    padding-left: 16px;
    font-size: 0.82rem;
    line-height: 1.42;
    color: #e2e8f0;
  }
  .detail-list li { margin-bottom: 4px; }
  .mix-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  select {
    width: 100%;
    background: #0f172a;
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px;
    font-size: 0.84rem;
    font-weight: 600;
  }
  .alert {
    border-radius: 12px;
    padding: 12px;
    margin-top: 10px;
    font-size: 0.84rem;
    line-height: 1.42;
    border: 1px solid;
  }
  .alert-green { background: var(--green-bg); border-color: var(--green); color: #dcfce7; }
  .alert-amber { background: var(--amber-bg); border-color: var(--amber); color: #fef3c7; }
  .alert-red { background: var(--red-bg); border-color: var(--red); color: #fee2e2; }
  .alert strong { display: block; font-size: 0.9rem; margin-bottom: 4px; }
  .rule-box {
    background: #162033;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px;
    margin-bottom: 9px;
  }
  .rule-pair {
    font-weight: 800;
    font-size: 0.88rem;
    color: #fca5a5;
    margin-bottom: 4px;
  }
  .rule-text {
    font-size: 0.81rem;
    color: #e2e8f0;
    line-height: 1.4;
    margin-bottom: 5px;
  }
  .rule-alt {
    font-size: 0.81rem;
    color: #86efac;
    line-height: 1.4;
  }
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #020617;
    border-top: 1px solid var(--border);
    padding: 8px 12px 10px;
    z-index: 30;
  }
  .bar-inner {
    display: flex;
    gap: 6px;
    max-width: 680px;
    margin: 0 auto;
  }
  .bar-inner input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: #fff;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 0.8rem;
  }
  .btn-mini {
    background: var(--accent);
    color: #020617;
    border: none;
    border-radius: 8px;
    padding: 8px 11px;
    font-weight: 800;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-mini.sec {
    background: var(--card-2);
    color: #fff;
  }
  .toast {
    position: fixed;
    top: 72px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--green);
    color: #020617;
    font-weight: 800;
    font-size: 0.82rem;
    padding: 8px 14px;
    border-radius: 999px;
    display: none;
    z-index: 50;
  }
</style>
</head>
<body>

<header>
  <div class="title-row">
    <h1>GUÍA RÁPIDA DE CURAS</h1>
    <span class="badge">TÉCNICO · COLOQUIAL</span>
  </div>
  <div class="sub">Consulta rápida de productos, uso y compatibilidades</div>
</header>

<nav>
  <button class="tab-btn active" onclick="showTab('catalogo', this)">1. Productos</button>
  <button class="tab-btn" onclick="showTab('mezclas', this)">2. Mezclas</button>
  <button class="tab-btn" onclick="showTab('heridas', this)">3. Heridas</button>
</nav>

<div id="toast" class="toast">Copiado al portapapeles</div>

<main>
  <!-- MÓDULO 1: CATÁLOGO TÉCNICO + COLOQUIAL -->
  <section id="catalogo" class="section active">
    <div class="card">
      <h2>Buscar por término técnico o coloquial</h2>
      <input type="text" id="buscador" class="search-box" placeholder="Ej: colagenasa, plata, yodo, come tejido, chupa exudado, bordes..." oninput="renderCatalogo()">
      <div class="filter-row" id="filtros-cat"></div>
      <div id="lista-productos"></div>
    </div>
  </section>

  <!-- MÓDULO 2: COMPROBADOR DE MEZCLAS E INCOMPATIBILIDADES -->
  <section id="mezclas" class="section">
    <div class="card">
      <h2>¿Se pueden poner juntos? (Comprobador rápido)</h2>
      <div class="mix-grid">
        <select id="prod-a" onchange="checkMix()"></select>
        <select id="prod-b" onchange="checkMix()"></select>
      </div>
      <div id="resultado-mix"></div>
    </div>

    <div class="card">
      <h2>Incompatibilidades clave en curas</h2>
      <div id="lista-reglas"></div>
    </div>
  </section>

  <!-- MÓDULO 3: ORIENTACIÓN POR TIPO DE HERIDA -->
  <section id="heridas" class="section">
    <div class="card">
      <h2>Orientación rápida según lo que ves</h2>
      <div id="lista-heridas"></div>
    </div>
  </section>
</main>

<div class="bottom-bar">
  <div class="bar-inner">
    <input type="text" id="nota-cura" placeholder="Nota rápida de cura (ej: limpieza + desbridante + apósito)..." oninput="saveNota()">
    <button class="btn-mini" onclick="copyNota()">Copiar</button>
    <button class="btn-mini sec" onclick="clearNota()">Limpiar</button>
  </div>
</div>

<script>
  /* =========================================================================
     BLOQUE MODULAR DE DATOS (Editable y ampliable sin tocar la interfaz)
     ========================================================================= */

  const CATEGORIAS = ["Todos", "Desbridantes", "Antisépticos / Plata", "Apósitos", "Bordes y piel"];

  const PRODUCTOS = [
    {
      id: "colagenasa",
      nombre: "Colagenasa (desbridante enzimático)",
      categoria: "Desbridantes",
      coloquial: "“La pomada que come el tejido muerto”, “pomada enzimática”, “la de los esfacelos”",
      paraQue: "Favorecer el desbridamiento enzimático de tejido necrótico o esfacelado.",
      evitarCuando: "No mezclar con plata, yodo ni otros antisépticos o enzimas que la inactiven/desnaturalicen.",
      comoUsar: "Limpiar previamente con suero fisiológico. Aplicar sobre tejido desvitalizado evitando invadir piel sana; mantener humedad adecuada."
    },
    {
      id: "plata",
      nombre: "Apósitos / soluciones con plata iónica",
      categoria: "Antisépticos / Plata",
      coloquial: "“El apósito de plata”, “la plata”, “el de carga bacteriana”",
      paraQue: "Control de carga bacteriana local o signos de infección local en heridas seleccionadas.",
      evitarCuando: "No combinar en la misma aplicación con enzimas proteolíticas como la colagenasa (inactiva su acción).",
      comoUsar: "Aplicar según indicación del apósito asegurando contacto con el lecho de la herida; reevaluar periódicamente."
    },
    {
      id: "yodo",
      nombre: "Compuestos yodados / antisépticos tópicos",
      categoria: "Antisépticos / Plata",
      coloquial: "“El yodo”, “la povidona”, “el antiséptico”",
      paraQue: "Antisepsia tópica puntual según protocolo y tipo de lesión.",
      evitarCuando: "Evitar uso simultáneo con colagenasa (puede desnaturalizarla e inhibir su efecto).",
      comoUsar: "Si se ha usado antiséptico, limpiar/irrigar con suero fisiológico antes de aplicar enzimas o apósitos activos."
    },
    {
      id: "enzimas_otras",
      nombre: "Otros desbridantes enzimáticos",
      categoria: "Desbridantes",
      coloquial: "“Las enzimas”, “la pomada enzimática”",
      paraQue: "Apoyo en la limpieza enzimática del lecho con tejido no viable.",
      evitarCuando: "No mezclar en la misma aplicación con plata ni antisépticos incompatibles.",
      comoUsar: "Aplicar sobre el lecho limpio tras irrigación; si se alterna con plata, separar tiempos con limpieza intermedia."
    },
    {
      id: "apositos_activos",
      nombre: "Apósitos activos (espumas, hidrocoloides, alginatos, hidrogeles)",
      categoria: "Apósitos",
      coloquial: "“La espuma”, “el apósito blando”, “la placa”, “el que chupa exudado”, “el que hidrata”",
      paraQue: "Gestionar exudado, mantener ambiente húmedo o aportar hidratación según el tipo de apósito.",
      evitarCuando: "Evitar ponerlos encima de pomadas grasas o densas que creen barrera e impidan su función.",
      comoUsar: "Colocar sobre herida limpia y adecuada al nivel de exudado, sin capas grasas interpuestas salvo indicación específica de bordes."
    },
    {
      id: "pomadas_grasas",
      nombre: "Pomadas grasas / densas / barrera",
      categoria: "Bordes y piel",
      coloquial: "“La pomada grasa”, “la de los bordes”, “la barrera para no macerar”",
      paraQue: "Proteger la piel perilesional frente a humedad/exudado o aportar lubricación/barrera.",
      evitarCuando: "Evitar extenderlas sobre el lecho donde deba actuar un apósito activo o un tratamiento incompatible.",
      comoUsar: "Aplicar en capa fina sobre piel perilesional o según indicación; mantener limpia la zona central si se usa apósito activo."
    }
  ];

  // Reglas basadas en la tabla de incompatibilidades aportada
  const REGLAS_INCOMPATIBILIDAD = [
    {
      a: "colagenasa",
      b: "plata",
      titulo: "Colagenasa + Plata",
      efecto: "La plata inactiva la enzima colagenasa, anulando su efecto desbridante.",
      alternativa: "Usar colagenasa sola o con apósitos no antimicrobianos. Si se necesita plata, aplicar en tiempos separados."
    },
    {
      a: "colagenasa",
      b: "yodo",
      titulo: "Colagenasa + Yodo",
      efecto: "El yodo, al igual que otros antisépticos, puede desnaturalizar la colagenasa e inhibir su acción.",
      alternativa: "Evitar el uso simultáneo. Limpiar la herida con suero fisiológico antes de aplicar colagenasa."
    },
    {
      a: "plata",
      b: "enzimas_otras",
      titulo: "Apósitos de plata + Enzimas",
      efecto: "Los iones de plata desactivan las enzimas proteolíticas (como la colagenasa) presentes en otros desbridantes.",
      alternativa: "No combinar en la misma aplicación. Alternar los tratamientos si ambos son necesarios, con limpieza intermedia."
    },
    {
      a: "apositos_activos",
      b: "pomadas_grasas",
      titulo: "Apósitos activos + Pomadas",
      efecto: "Las pomadas grasas o densas pueden crear una barrera que impide el contacto del apósito activo con la herida.",
      alternativa: "Aplicar apósitos activos sobre la herida limpia, sin barreras de pomadas, a menos que se indique lo contrario para bordes."
    }
  ];

  const ORIENTACION_HERIDAS = [
    {
      titulo: "Tejido necrótico o esfacelo",
      coloquial: "“Costra negra/seca o telilla amarilla/blanca pegada”",
      enfoque: "Limpieza con suero fisiológico y valoración de desbridamiento (enzimático, autolítico o cortante según criterio y capacitación). Revisar compatibilidades antes de añadir plata o yodo."
    },
    {
      titulo: "Exudado abundante o piel perilesional macerada",
      coloquial: "“Supura mucho o la piel de alrededor está blanca/reblandecida”",
      enfoque: "Priorizar gestión del exudado y protección de la piel perilesional. Evitar que el exceso de humedad macere los bordes y no interponer barreras grasas donde no corresponda."
    },
    {
      titulo: "Lecho limpio en granulación",
      coloquial: "“Rojo limpio, granulado y con poco exudado”",
      enfoque: "Mantener ambiente húmedo equilibrado y proteger el tejido neoformado sin agresiones ni mezclas innecesarias."
    }
  ];

  /* =========================================================================
     LÓGICA DE INTERFAZ (Reutilizable y extensible para futuros módulos)
     ========================================================================= */

  let catActiva = "Todos";

  function showTab(id, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    btn.classList.add('active');
  }

  function renderFiltros() {
    const cont = document.getElementById('filtros-cat');
    cont.innerHTML = CATEGORIAS.map(c =>
      `<button class="chip ${c === catActiva ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
    ).join('');
  }

  function setCat(c) {
    catActiva = c;
    renderFiltros();
    renderCatalogo();
  }

  function renderCatalogo() {
    const q = (document.getElementById('buscador').value || '').toLowerCase().trim();
    const cont = document.getElementById('lista-productos');
    const filtrados = PRODUCTOS.filter(p => {
      const matchCat = catActiva === "Todos" || p.categoria === catActiva;
      const texto = `${p.nombre} ${p.categoria} ${p.coloquial} ${p.paraQue} ${p.evitarCuando} ${p.comoUsar}`.toLowerCase();
      const matchQ = !q || texto.includes(q);
      return matchCat && matchQ;
    });

    if (!filtrados.length) {
      cont.innerHTML = '<div class="alert alert-amber"><strong>Sin coincidencias</strong>Prueba con otra palabra técnica o coloquial.</div>';
      return;
    }

    cont.innerHTML = filtrados.map(p => `
      <div class="item-card">
        <div class="item-top">
          <div class="item-title">${p.nombre}</div>
          <span class="item-cat">${p.categoria}</span>
        </div>
        <div class="coloquial">En consulta / coloquial: ${p.coloquial}</div>
        <ul class="detail-list">
          <li><strong>Para qué sirve:</strong> ${p.paraQue}</li>
          <li><strong>Ojo / Precaución:</strong> ${p.evitarCuando}</li>
          <li><strong>Cómo aplicarlo:</strong> ${p.comoUsar}</li>
        </ul>
      </div>
    `).join('');
  }

  function initMixSelects() {
    const opts = PRODUCTOS.map(p => `<option value="${p.id}">${p.nombre}</option>`).join('');
    document.getElementById('prod-a').innerHTML = opts;
    document.getElementById('prod-b').innerHTML = opts;
    document.getElementById('prod-b').selectedIndex = 1;
    checkMix();
  }

  function checkMix() {
    const a = document.getElementById('prod-a').value;
    const b = document.getElementById('prod-b').value;
    const res = document.getElementById('resultado-mix');

    if (a === b) {
      res.innerHTML = '<div class="alert alert-amber"><strong>Mismo producto seleccionado</strong>Elige dos productos distintos para comprobar su combinación.</div>';
      return;
    }

    const regla = REGLAS_INCOMPATIBILIDAD.find(r => (r.a === a && r.b === b) || (r.a === b && r.b === a));
    if (regla) {
      res.innerHTML = `
        <div class="alert alert-red">
          <strong>INCOMPATIBILIDAD / PRECAUCIÓN: ${regla.titulo}</strong>
          <div>${regla.efecto}</div>
          <div style="margin-top:6px;"><strong>Alternativa correcta:</strong> ${regla.alternativa}</div>
        </div>
      `;
    } else {
      res.innerHTML = `
        <div class="alert alert-green">
          <strong>Sin incompatibilidad registrada en esta tabla</strong>
          Revisa siempre las indicaciones del fabricante y la valoración clínica de la herida antes de aplicar.
        </div>
      `;
    }
  }

  function renderReglas() {
    document.getElementById('lista-reglas').innerHTML = REGLAS_INCOMPATIBILIDAD.map(r => `
      <div class="rule-box">
        <div class="rule-pair">${r.titulo}</div>
        <div class="rule-text"><strong>Efecto:</strong> ${r.efecto}</div>
        <div class="rule-alt"><strong>Alternativa correcta:</strong> ${r.alternativa}</div>
      </div>
    `).join('');
  }

  function renderHeridas() {
    document.getElementById('lista-heridas').innerHTML = ORIENTACION_HERIDAS.map(h => `
      <div class="item-card">
        <div class="item-title">${h.titulo}</div>
        <div class="coloquial">Coloquial: ${h.coloquial}</div>
        <ul class="detail-list">
          <li>${h.enfoque}</li>
        </ul>
      </div>
    `).join('');
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 1700);
  }

  function saveNota() {
    localStorage.setItem('curas_nota', document.getElementById('nota-cura').value);
  }

  function copyNota() {
    const val = document.getElementById('nota-cura').value || 'Sin nota de cura';
    navigator.clipboard.writeText(val).then(() => toast('Nota copiada'));
  }

  function clearNota() {
    localStorage.removeItem('curas_nota');
    document.getElementById('nota-cura').value = '';
    toast('Nota limpiada');
  }

  window.onload = () => {
    renderFiltros();
    renderCatalogo();
    initMixSelects();
    renderReglas();
    renderHeridas();
    document.getElementById('nota-cura').value = localStorage.getItem('curas_nota') || '';
  };
</script>
</body>
</html>
